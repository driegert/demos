<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics demos</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #59636e; --card: #f6f8fa; --border: #d1d9e0; --link: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --muted: #9198a1; --card: #161b22; --border: #30363d; --link: #4493f8; } }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); line-height: 1.5; }
  main { max-width: 52rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .25rem; }
  p.lead { color: var(--muted); margin: 0 0 2rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
  .card { padding: 1rem 1.125rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--card); }
  .card h2 { font-size: 1.05rem; margin: 0 0 .35rem; }
  .card h2 a { color: var(--link); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .card p.links { margin-top: .6rem; font-size: .9rem; }
  .card p.links a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Statistics demos</h1>
  <p class="lead">Small interactive demos for statistics courses. Each opens in the browser with no setup.</p>
  <div class="grid">
    <div class="card">
      <h2><a href="estimate-pi/">Estimating π by Monte Carlo</a></h2>
      <p>Drop random points in a unit square and watch the fraction inside the quarter circle converge to π/4.</p>
      <p class="links"><a href="estimate-pi/">Open the applet</a> · <a href="estimate-pi/estimate-pi.pdf">Handout (PDF)</a> · <a href="estimate-pi/estimate-pi.qmd">Handout source (.qmd)</a></p>
    </div>
  </div>
</main>
</body>
</html>
